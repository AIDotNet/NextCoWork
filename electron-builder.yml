appId: com.nextcowork.app
productName: NextCoWork
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!resources/skills/**/*'
  - '!.next-cowork'
  - '!docs/*'
  - '!test/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierrc,.prettierignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  # electron-builder 只会自动排除 directories.output 指向的那个目录。发版时需要把输出改到
  # iCloud 同步范围之外(见下方 afterPack 的说明),此时 dist 不再是输出目录,必须在这里显式
  # 排除,否则历史安装包会被一并打进 app,体积从 134M 涨到 800M。
  - '!dist'
extraResources:
  - from: resources/skills
    to: skills
    filter:
      - '**/*'
  # 插件宿主窗口的 preload。手写的 .cjs,原样拷进 resources —— 它是安全边界,
  # 应该能被逐行读完(理由见那个文件的头)。
  - from: resources/plugin-preload.cjs
    to: plugin-preload.cjs
  # 插件视图的运行时(React / nextcowork/ui / nextcowork/view)。由
  # `scripts/build-plugin-runtime.mjs` 生成、不进版本库,所以这里拷的是构建产物 ——
  # 漏了它,打包后插件视图一律 `Failed to resolve module specifier "react"`,
  # 而开发时一切正常。
  - from: resources/plugin-runtime
    to: plugin-runtime
    filter:
      - '**/*'
asarUnpack:
  - '**/node_modules/node-pty/**'
  - 'resources/**'
npmRebuild: true
electronFuses:
  # ★ 必须保持 true。Windows 的 SSH 密码认证靠它:OpenSSH 只肯把 SSH_ASKPASS 指向一个
  # exe(CreateProcess 起不了 .cmd/`#!` 脚本),所以 helper 只能是**同一个 exe 的 node
  # 形态** —— 关掉这个 fuse,它会退回带 Chromium 的 GUI 形态,Chromium 往 stdout 写的
  # 那个换行会被 OpenSSH 当成密码,表现为「密码明明是对的却一直认证失败」。
  # 详见 src/main/environment/ssh/askpass.ts。`browser/headless.ts` 拉 Playwright 安装器
  # 时同样以 node 形态起自己。
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: false
  onlyLoadAppFromAsar: false
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: true
  # 必须保持 false。开启后 fuse 步骤会自己去 codesign，而那次调用不在我们控制内，
  # 碰上 iCloud 补盖的 com.apple.FinderInfo 就会以 "detritus not allowed" 整个构建失败。
  resetAdHocDarwinSignature: false
# macOS 的 fuse 翻转与 ad-hoc 签名都在这个钩子里按正确顺序完成(先翻 fuse 再签名),
# 否则 fuse 写入会让签名作废,应用启动即被内核杀掉。详见钩子文件里的说明。
# 另:若仓库位于 iCloud 同步范围内(如 ~/Desktop),文件提供者会不断往 .app/.framework 目录上
# 补盖 com.apple.FinderInfo,这个属性会被打进 dmg/zip,使产物无法通过 codesign --verify。
# 发版请把输出改到同步范围之外:
#   npm run dist:ci -- -c.directories.output=/tmp/ncw-release
afterPack: scripts/mac-adhoc-sign.mjs
publish:
  provider: generic
  url: https://nextco.work/api/client/updates/feed/stable/
win:
  target:
    - nsis
mac:
  category: public.app-category.developer-tools
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
linux:
  target:
    - AppImage
nsis:
  oneClick: false
  # oneClick: false 只是把安装器切成向导模式,默认仍然不带"选择安装目录"页,
  # 必须显式开启下面这个开关,用户才能在安装时自定义目录。
  allowToChangeInstallationDirectory: true
  perMachine: false
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  createDesktopShortcut: always
