<!doctype html>
<html lang="zh-CN" data-theme="dark" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextCoWork 启动加载动画方案</title>
<style>
  :root {
    --bg: #141414; --surface: #191919; --raised: #1f1f1f; --muted: #242424;
    --fg: #f5f5f5; --text2: #a8a8a8; --text3: #707070; --border: #2c2c2c; --border-strong: #3a3a3a;
    --danger: #f0616d; --success: #5fcf8c; --scrim: rgba(0,0,0,.5);
    --ease-enter: cubic-bezier(.2,.8,.2,1); --ease-exit: cubic-bezier(.4,0,1,1); --ease-std: cubic-bezier(.4,0,.2,1);
    --d-fast: 160ms; --d-std: 240ms; --d-slow: 480ms; --d-exit: 180ms;
    --stagger-item: 35ms; --stagger-line: 80ms;
    --page: #0d0d0d; --page-fg: #ededed;
  }
  [data-theme="light"] {
    --bg: #ffffff; --surface: #ffffff; --raised: #ffffff; --muted: #f6f6f6;
    --fg: #0b0b0b; --text2: #666666; --text3: #9a9a9a; --border: #e6e6e6; --border-strong: #d2d2d2;
    --danger: #d12c3c; --success: #1f9d55; --scrim: rgba(0,0,0,.25);
    --page: #f1f1f1; --page-fg: #161616;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--page-fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
  body { padding: 0 0 80px; }
  header.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid color-mix(in srgb, var(--page-fg) 12%, transparent); }
  .top-in { max-width: 1280px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: center; }
  .top h1 { font-size: 16px; margin: 0 8px 0 0; font-weight: 650; letter-spacing: .01em; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: color-mix(in srgb, var(--page-fg) 62%, transparent); }
  .seg { display: inline-flex; background: color-mix(in srgb, var(--page-fg) 8%, transparent); border-radius: 8px; padding: 2px; }
  .seg button { all: unset; cursor: pointer; padding: 4px 10px; border-radius: 6px; font-size: 12px; color: color-mix(in srgb, var(--page-fg) 70%, transparent); }
  .seg button[aria-pressed="true"] { background: var(--page-fg); color: var(--page); }
  .seg button:focus-visible { outline: 2px solid #4c8dff; }
  .btn { all: unset; cursor: pointer; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--page-fg); color: var(--page); }
  .btn.ghost { background: color-mix(in srgb, var(--page-fg) 9%, transparent); color: var(--page-fg); }
  .btn:focus-visible { outline: 2px solid #4c8dff; }
  .intro { max-width: 1280px; margin: 0 auto; padding: 22px 24px 4px; color: color-mix(in srgb, var(--page-fg) 72%, transparent); }
  .intro b { color: var(--page-fg); }
  .intro ul { margin: 8px 0 0; padding-left: 18px; }
  main { max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 22px; }
  @media (max-width: 620px) { main { grid-template-columns: 1fr; padding: 14px 16px; } .top-in, .intro { padding-left: 16px; padding-right: 16px; } }
  .card { background: color-mix(in srgb, var(--page-fg) 4%, transparent); border: 1px solid color-mix(in srgb, var(--page-fg) 11%, transparent); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .card.picked { border-color: #4c8dff; box-shadow: 0 0 0 2px color-mix(in srgb, #4c8dff 35%, transparent); }
  .card h2 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h2 .k { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--page-fg); color: var(--page); font-size: 12px; font-weight: 700; }
  .card h2 .cur { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, #4c8dff 22%, transparent); color: #4c8dff; }
  .card p.sub { margin: 0; color: color-mix(in srgb, var(--page-fg) 70%, transparent); }
  .pc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 12.5px; }
  .pc div { background: color-mix(in srgb, var(--page-fg) 5%, transparent); border-radius: 10px; padding: 8px 10px; }
  .pc b { display: block; font-size: 11px; letter-spacing: .04em; margin-bottom: 2px; }
  .pc .p b { color: var(--success); } .pc .c b { color: #e0a23b; }
  .pc ul { margin: 0; padding-left: 16px; color: color-mix(in srgb, var(--page-fg) 78%, transparent); }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: color-mix(in srgb, var(--page-fg) 62%, transparent); }
  .meta .cx { padding: 1px 8px; border-radius: 999px; background: color-mix(in srgb, var(--page-fg) 9%, transparent); }
  .meta .spacer { flex: 1; }

  /* ───────── 模拟窗口 ───────── */
  .win { position: relative; aspect-ratio: 16 / 10; border-radius: 12px; overflow: hidden; background: var(--bg); border: 1px solid var(--border-strong); color: var(--fg); isolation: isolate; font-size: 13px; }
  .shell { position: absolute; inset: 0; display: grid; grid-template-columns: 7% 27% 1fr; grid-template-rows: 28px 1fr; background: var(--muted); }
  .shell .tb { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .shell .tb i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--fg) 22%, transparent); }
  .shell .rail { background: var(--muted); border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 10px 0; }
  .shell .rail i { width: 60%; aspect-ratio: 1; border-radius: 8px; background: color-mix(in srgb, var(--fg) 14%, transparent); }
  .shell .panel { background: var(--muted); border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 7px; }
  .shell .panel i { height: 9px; border-radius: 5px; background: color-mix(in srgb, var(--fg) 12%, transparent); }
  .shell .panel i:first-child { height: 14px; width: 70%; background: color-mix(in srgb, var(--fg) 20%, transparent); }
  .shell .work { background: var(--bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .shell .work i { height: 9px; border-radius: 5px; background: color-mix(in srgb, var(--fg) 10%, transparent); }
  .shell .work .cmp { margin-top: auto; height: 22px; border-radius: 8px; border: 1px solid var(--border-strong); background: transparent; }
  .ov { position: absolute; inset: 0; background: var(--bg); display: grid; place-items: center; transition: opacity var(--d-exit) var(--ease-exit); }
  .ov.hide { opacity: 0; pointer-events: none; }
  .ov.gone { display: none; }
  .ct { opacity: 0; visibility: hidden; width: 100%; padding: 0 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ct.on { opacity: 1; visibility: visible; }
  .cap { position: absolute; left: 10px; bottom: 8px; font-size: 10.5px; color: var(--text3); font-variant-numeric: tabular-nums; z-index: 5; }
  .cap-r { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 6px; z-index: 5; }
  .cap-r button { all: unset; cursor: pointer; font-size: 11px; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--text2); }
  .cap-r button:focus-visible { outline: 2px solid #4c8dff; }
  .hint { font-size: 11.5px; color: var(--text3); text-align: center; min-height: 1.4em; }
  .detail { font-size: 12px; color: var(--text3); text-align: center; min-height: 1.5em; transition: opacity var(--d-fast) var(--ease-std); }
  .fail { display: none; flex-direction: column; align-items: center; gap: 8px; text-align: center; max-width: 340px; }
  .fail.on { display: flex; }
  .fail h3 { margin: 0; font-size: 14px; }
  .fail p { margin: 0; font-size: 11.5px; color: var(--text3); }
  .fail .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .fail .row span { font-size: 11px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border-strong); color: var(--fg); }
  .fail .row span.pri { background: var(--fg); color: var(--bg); border-color: transparent; font-weight: 600; }
  svg { display: block; }
  .ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* 动效级别:减弱 = 只有短淡入,没有位移 / 缩放 / 循环;关闭 = 全部立即 */
  [data-motion="reduced"] .win *, [data-motion="reduced"] .win *::before { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
  [data-motion="off"] .win *, [data-motion="off"] .win *::before { animation: none !important; transition: none !important; }
  [data-motion="off"] .loop { display: none !important; }
  [data-motion="off"] .F .ln { opacity: 1; }

  /* ═══════════ A · 环 ═══════════ */
  .A .mark { width: 84px; height: 84px; animation: aGrow var(--d-slow) var(--ease-enter) both; }
  .A .mark .track { fill: none; stroke: var(--border-strong); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 308; animation: aDraw var(--d-slow) var(--ease-enter) both; }
  .A .mark .arc { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 52px 52px; transition: stroke-dasharray .6s var(--ease-std); }
  .A .comet { transform-origin: 52px 52px; animation: spin .9s linear infinite, fadeIn var(--d-fast) 480ms both; }
  .A .comet circle { fill: none; stroke: var(--text2); stroke-width: 3; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 52px 52px; }
  .A .tile rect { fill: var(--fg); } .A .tile path { fill: none; stroke: var(--bg); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .A .title { font-weight: 650; font-size: 16px; animation: rise var(--d-std) var(--stagger-line) var(--ease-enter) both; }
  .A ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
  .A.ct { gap: 8px; }
  .A li { display: flex; align-items: center; gap: 8px; opacity: .45; animation: rise var(--d-std) calc(160ms + var(--i) * var(--stagger-item)) var(--ease-enter) both; }
  .A li[data-s="active"] { opacity: 1; font-weight: 650; } .A li[data-s="done"] { opacity: .7; }
  .A li .g { width: 16px; height: 16px; position: relative; }
  .A li .g svg { position: absolute; inset: 0; width: 16px; height: 16px; }
  .A li .g .ck, .A li .g .sp { opacity: 0; } .A li[data-s="done"] .g .ck { opacity: 1; animation: pop var(--d-std) var(--ease-enter) both; }
  .A li[data-s="active"] .g .sp { opacity: 1; animation: spin .9s linear infinite; } .A li[data-s="pending"] .g .ci { opacity: 1; } .A li:not([data-s="pending"]) .g .ci { opacity: 0; }
  .A .detail { animation: fadeIn var(--d-fast) 360ms both; }

  /* ═══════════ B · 描边 ═══════════ */
  .B .glyph { width: 116px; height: 116px; animation: aGrow var(--d-slow) var(--ease-enter) both; }
  .B .ghost { fill: none; stroke: var(--border-strong); stroke-width: 2.4; }
  .B .draw { fill: none; stroke: var(--fg); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1000; transition: stroke-dashoffset .7s var(--ease-std); }
  .B .fillbg { fill: var(--fg); opacity: 0; transition: opacity .45s var(--ease-std); } .B .done .fillbg { opacity: 1; }
  .B .star-draw.solid { fill: var(--bg); } .B .starfill { fill: var(--bg); opacity: 0; transition: opacity .45s var(--ease-std) .1s; } .B .done .starfill { opacity: 1; }
  .B .done .draw { stroke: var(--bg); transition: stroke .3s .2s; } .B .done .tile-outline { stroke: var(--fg); }
  .B .glyph.wait { animation: aGrow var(--d-slow) var(--ease-enter) both, breathe 2.4s ease-in-out 700ms infinite; }
  .B .stage { font-weight: 650; font-size: 15px; height: 1.5em; position: relative; text-align: center; animation: rise var(--d-std) var(--stagger-line) var(--ease-enter) both; }
  .B .stage span { display: inline-block; transition: opacity var(--d-fast) var(--ease-std), transform var(--d-std) var(--ease-enter); }
  .B .stage span.out { opacity: 0; transform: translateY(-4px); } .B .stage span.in { opacity: 0; transform: translateY(4px); }
  .B .count { display: flex; gap: 5px; animation: fadeIn var(--d-fast) 240ms both; } .B .count i { width: 6px; height: 6px; border-radius: 50%; background: var(--border-strong); transition: background .3s, transform .3s var(--ease-enter); }
  .B .count i.on { background: var(--fg); transform: scale(1.15); }

  /* ═══════════ C · 线轴 ═══════════ */
  .C .rail { position: relative; width: min(100%, 360px); height: 64px; animation: fadeIn var(--d-fast) both; }
  .C .rail .line { position: absolute; left: 14px; right: 14px; top: 14px; height: 2px; background: var(--border-strong); border-radius: 1px; transform-origin: left; animation: lineIn var(--d-slow) var(--ease-enter) both; }
  .C .rail .fill { position: absolute; left: 14px; top: 14px; height: 2px; background: var(--fg); border-radius: 1px; width: 0; transition: width .6s var(--ease-std); }
  .C .nodes { position: absolute; inset: 0; display: flex; justify-content: space-between; padding: 0; }
  .C .node { width: 28px; display: flex; flex-direction: column; align-items: center; gap: 8px; animation: pop var(--d-std) calc(var(--i) * var(--stagger-item)) var(--ease-enter) both; }
  .C .dot { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border-strong); background: var(--bg); display: grid; place-items: center; color: var(--bg); transition: background .3s, border-color .3s; position: relative; }
  .C .node[data-s="done"] .dot { background: var(--fg); border-color: var(--fg); }
  .C .node[data-s="active"] .dot { border-color: var(--fg); }
  .C .node[data-s="active"] .dot::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--fg); animation: ripple 1.6s ease-out infinite; }
  .C .dot svg { width: 14px; height: 14px; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .3s var(--ease-enter); } .C .node[data-s="done"] .dot svg { opacity: 1; transform: scale(1); }
  .C .lbl { position: absolute; top: 40px; font-size: 11.5px; white-space: nowrap; color: var(--text3); transition: opacity var(--d-fast); opacity: 0; transform: translateX(-50%); left: 14px; }
  .C .node[data-s="active"] .lbl { opacity: 1; color: var(--fg); font-weight: 650; }
  .C .big { font-size: 15px; font-weight: 650; animation: rise var(--d-std) var(--stagger-line) var(--ease-enter) both; display: flex; align-items: center; gap: 8px; }
  .C .big svg { width: 20px; height: 20px; }

  /* ═══════════ D · 骨架拼装 ═══════════ */
  .D .sk { width: min(66%, 330px); aspect-ratio: 16 / 10; position: relative; border: 1px solid var(--border-strong); border-radius: 10px; overflow: hidden; background: var(--muted); animation: aGrow var(--d-slow) var(--ease-enter) both; transform-origin: center; }
  .D .part { position: absolute; transition: opacity .5s var(--ease-enter), transform .6s var(--ease-enter); opacity: .14; }
  .D .part.lit { opacity: 1; transform: none !important; }
  .D .tbar { left: 0; right: 0; top: 0; height: 12%; border-bottom: 1px solid var(--border); display: flex; gap: 4px; align-items: center; padding: 0 3%; } .D .tbar i { width: 5px; height: 5px; border-radius: 50%; background: var(--text3); }
  .D .rail { left: 0; top: 12%; bottom: 0; width: 9%; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; align-items: center; padding-top: 6%; transform: translateX(-10px); } .D .rail i { width: 56%; aspect-ratio: 1; border-radius: 4px; background: var(--text3); }
  .D .phead { left: 9%; width: 26%; top: 12%; height: 11%; border-bottom: 1px solid var(--border); padding: 3% 4%; transform: translateY(-6px); } .D .phead i { display: block; height: 6px; width: 60%; border-radius: 3px; background: var(--text2); }
  .D .plist { left: 9%; width: 26%; top: 23%; bottom: 0; border-right: 1px solid var(--border); padding: 4%; display: flex; flex-direction: column; gap: 7px; transform: translateX(-8px); } .D .plist i { height: 6px; border-radius: 3px; background: var(--text3); } .D .plist i:nth-child(2n) { width: 70%; }
  .D .work { left: 35%; right: 0; top: 12%; bottom: 0; padding: 4% 5%; display: flex; flex-direction: column; gap: 7px; transform: translateY(8px); background: var(--bg); } .D .work i { height: 6px; border-radius: 3px; background: var(--text3); } .D .work i:nth-child(3n) { width: 65%; } .D .work .cmp { margin-top: auto; height: 16px; border-radius: 6px; border: 1px solid var(--text3); background: transparent; }
  .D .name { font-weight: 650; font-size: 14px; animation: rise var(--d-std) var(--stagger-line) var(--ease-enter) both; }
  .D.reveal-grow .sk { transition: transform .3s var(--ease-enter), opacity .3s; transform: scale(1.04); opacity: 0; }

  /* ═══════════ E · 静线 ═══════════ */
  .E .topline { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: color-mix(in srgb, var(--fg) 8%, transparent); z-index: 4; }
  .E .topline .f { height: 100%; width: 0; background: var(--fg); transition: width .7s var(--ease-std); position: relative; }
  .E .topline .f::after { content: ""; position: absolute; right: 0; top: -1px; width: 56px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--fg)); opacity: .0; }
  .E .topline.wait .f::after { opacity: .55; animation: shimmerPulse 1.6s ease-in-out infinite; }
  .E .tile { width: 56px; height: 56px; border-radius: 15px; background: var(--fg); display: grid; place-items: center; animation: gentle var(--d-std) var(--ease-enter) both; }
  .E .tile.breathe { animation: gentle var(--d-std) var(--ease-enter) both, breatheS 2.6s ease-in-out 400ms infinite; }
  .E .tile svg { width: 28px; height: 28px; } .E .tile path { fill: none; stroke: var(--bg); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .E .status { font-size: 12.5px; color: var(--text2); height: 1.6em; animation: rise var(--d-std) 120ms var(--ease-enter) both; position: relative; }
  .E .status span { display: inline-block; transition: opacity var(--d-fast), transform var(--d-std) var(--ease-enter); }
  .E .status span.out { opacity: 0; transform: translateY(-3px); } .E .status span.in { opacity: 0; transform: translateY(3px); }

  /* ═══════════ F · 启动日志 ═══════════ */
  .F .term { width: min(100%, 400px); font: 12px/1.7 ui-monospace, "SF Mono", Menlo, Consolas, monospace; background: var(--muted); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; animation: fadeIn var(--d-fast) both; }
  .F .hd { color: var(--text3); margin-bottom: 4px; }
  .F .ln { display: flex; gap: 8px; align-items: baseline; opacity: 0; animation: lineType var(--d-std) calc(var(--i) * var(--stagger-item)) var(--ease-enter) both; }
  .F .ln .m { width: 14px; color: var(--text3); } .F .ln.done .m { color: var(--success); } .F .ln .t { margin-left: auto; color: var(--text3); font-variant-numeric: tabular-nums; }
  .F .ln.pending { color: var(--text3); } .F .ln.active { color: var(--fg); } .F .ln.done { color: var(--text2); }
  .F .sub { padding-left: 22px; color: var(--text3); font-size: 11.5px; }
  .F .caret { display: inline-block; width: 7px; height: 13px; background: var(--fg); vertical-align: -2px; margin-left: 4px; animation: blink 1s steps(2, start) infinite; }
  .F .bar { margin-top: 8px; color: var(--text2); } .F .bar b { color: var(--fg); font-weight: 600; }
  .F .warn { color: #e0a23b; margin-top: 6px; } .F .err { color: var(--danger); }
  .F .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; } .F .actions span { border: 1px solid var(--border-strong); border-radius: 6px; padding: 0 8px; color: var(--fg); }

  @keyframes aGrow { from { opacity: 0; transform: scale(.84); } to { opacity: 1; transform: none; } }
  @keyframes aDraw { from { stroke-dashoffset: 308; } to { stroke-dashoffset: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes gentle { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(1.55); opacity: 0; } }
  @keyframes lineIn { from { transform: scaleX(0); } to { transform: none; } }
  @keyframes breathe { 0%,100% { opacity: .78; } 50% { opacity: 1; } }
  @keyframes breatheS { 0%,100% { transform: scale(1); } 50% { transform: scale(1.045); } }
  @keyframes shimmerPulse { 0%,100% { opacity: .15; } 50% { opacity: .6; } }
  @keyframes blink { to { visibility: hidden; } }
  @keyframes lineType { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
  footer.pick { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: color-mix(in srgb, var(--page) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid color-mix(in srgb, var(--page-fg) 14%, transparent); }
  footer.pick .in { max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; }

        <rect class="draw tile-outline" x="14" y="14" width="88" height="88" rx="26" pathLength="1000" stroke-dashoffset="1000" transform="rotate(-90 58 58)"/>
        <g class="starfill" style="color:var(--bg)"><g fill="var(--bg)" stroke="none" transform="translate(34 34) scale(2.2)">${SPARK.replace(/<path /g, '<path fill="var(--bg)" stroke="none" ')}</g></g>
        <g style="stroke:var(--text3);opacity:.25;fill:none;stroke-width:1.1" transform="translate(34 34) scale(2.2)">${SPARK}</g>
        <g class="draw-star" transform="translate(34 34) scale(2.2)" style="fill:none;stroke:var(--fg);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round">${SPARK.replace(/<path /g, '<path class="draw" pathLength="1000" stroke-dashoffset="1000" style="stroke-width:1.2" ')}</g>
      </g></svg>
      <div class="stage"><span></span></div>
      <div class="count">${STAGES.map(() => '<i></i>').join('')}</div>
      <div class="detail"></div><div class="hint"></div>${failBlock()}`;
    const gl = $('.glyph', root), g = $('.gl', root), outline = $('.draw.tile-outline', root), strokes = [...root.querySelectorAll('.draw-star .draw')], stage = $('.stage', root), dots = [...root.querySelectorAll('.count i')], det = $('.detail', root), hint = $('.hint', root);
    return s => {
      const f = s.fraction;
      outline.setAttribute('stroke-dashoffset', (1000 * (1 - Math.min(1, f * 1.15))).toFixed(0));
      strokes.forEach(p => p.setAttribute('stroke-dashoffset', (1000 * (1 - Math.max(0, Math.min(1, (f - .1) / .9)))).toFixed(0)));
      g.classList.toggle('done', s.ready && !s.fail);
      gl.classList.toggle('wait', !s.ready && !s.fail);
      dots.forEach((d, i) => d.classList.toggle('on', s.ds.has(STAGES[i])));
      swapText(stage, s.fail ? '' : s.ready ? t.detail.settle.replace('…', '') : t.stages[STAGES[s.cur]]);
      setDetail(det, { ...s, detailKey: s.fail || s.ready ? null : (STAGES[s.cur] === 'data' && s.step > 0 ? 's' + s.step : null) }); setHint(hint, s);
      $('.fail', root).classList.toggle('on', !!s.fail);
      [gl, stage, $('.count', root), det, hint].forEach(n => n.style.display = s.fail ? 'none' : '');
    };
  },
  C(root) {
    const t = T();
    root.className = 'ct C';
    root.innerHTML = `
      <div class="big">${svg(SPARK).replace('<svg', '<svg')}<span>NextCoWork</span></div>
      <div class="rail"><div class="line"></div><div class="fill"></div><div class="nodes">${STAGES.map((s, i) => `<div class="node" data-s="pending" style="--i:${i}"><div class="dot">${svg(TICK)}</div><div class="lbl">${t.stages[s]}</div></div>`).join('')}</div></div>
      <div class="detail"></div><div class="hint"></div>${failBlock()}`;
    const rail = $('.rail', root), fill = $('.fill', root), nodes = [...root.querySelectorAll('.node')], det = $('.detail', root), hint = $('.hint', root), big = $('.big', root);
    // 节点按 flex 均分:第 i 个节点中心 = 14 + i * (宽 - 28) / 4 (线的两端对齐节点中心)
    const place = () => {
      const w = rail.clientWidth; if (!w) return;
      nodes.forEach((n, i) => { const x = 14 + i * (w - 28) / 4; n.style.position = 'absolute'; n.style.left = (x - 14) + 'px'; n.querySelector('.lbl').style.left = '14px'; });
      rail.dataset.w = w;
    };
    return s => {
      place();
      const w = rail.clientWidth; const total = Math.max(0, w - 28);
      // 线填到「最后一个已完成节点」的位置,再加当前阶段里真实的子进度
      const lastDone = STAGES.reduce((a, st, i) => s.ds.has(st) ? i : a, -1);
      const sub = (!s.ds.has('data') && s.step > 0) ? ((s.step - 1) / 4) * (total / 4) : 0;
      fill.style.width = (lastDone < 0 ? 0 : (lastDone / 4) * total + sub) + 'px';
      nodes.forEach((n, i) => n.dataset.s = s.ds.has(STAGES[i]) ? 'done' : i === s.cur && !s.fail ? 'active' : 'pending');
      setDetail(det, s); setHint(hint, s);
      $('.fail', root).classList.toggle('on', !!s.fail);
      [rail, det, hint, big].forEach(n => n.style.display = s.fail ? 'none' : '');
    };
  },
  D(root, run) {
    const t = T();
    root.className = 'ct D';
    root.innerHTML = `
      <div class="sk">
        <div class="part tbar" data-st="app"><i></i><i></i><i></i></div>
        <div class="part rail" data-st="agent"><i></i><i></i><i></i><i></i></div>
        <div class="part phead" data-st="connect"><i></i></div>
        <div class="part plist" data-st="data"><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="part work" data-st="content"><i></i><i></i><i></i><i></i><i></i><div class="cmp"></div></div>
      </div>
      <div class="name">NextCoWork</div><div class="detail"></div><div class="hint"></div>${failBlock()}`;
    const parts = [...root.querySelectorAll('.part')], det = $('.detail', root), hint = $('.hint', root), nm = $('.name', root), sk = $('.sk', root);
    return s => {
      parts.forEach(p => p.classList.toggle('lit', s.ds.has(p.dataset.st)));
      root.classList.toggle('reveal-grow', s.revealing && !s.fail);
      setDetail(det, s); setHint(hint, s);
      $('.fail', root).classList.toggle('on', !!s.fail);
      [sk, det, hint, nm].forEach(n => n.style.display = s.fail ? 'none' : '');
    };
  },
  E(root) {
    const t = T();
    root.className = 'ct E';
    root.innerHTML = `
      <div class="tile breathe">${svg(SPARK).replace('<svg', '<svg')}</div>
      <div class="status"><span></span></div><div class="hint"></div>${failBlock()}`;
    const tile = $('.tile', root), status = $('.status', root), hint = $('.hint', root);
    return (s, host) => {
      const line = host.querySelector('.topline'), f = host.querySelector('.topline .f');
      f.style.width = (s.fraction * 100).toFixed(1) + '%';
      line.classList.toggle('wait', !s.ready && !s.fail);
      tile.classList.toggle('breathe', !s.ready && !s.fail);
      swapText(status, s.fail ? '' : s.ready ? t.detail.settle : (STAGES[s.cur] === 'data' && s.step > 0 ? t.detail['s' + s.step] : t.detail[STAGES[s.cur]]));
      setHint(hint, s);
      $('.fail', root).classList.toggle('on', !!s.fail);
      [tile, status, hint].forEach(n => n.style.display = s.fail ? 'none' : '');
      line.style.background = s.fail ? 'color-mix(in srgb, var(--danger) 55%, transparent)' : '';
    };
  },
  F(root) {
    const t = T();
    root.className = 'ct F';
    root.innerHTML = `<div class="term"><div class="hd">${t.bootHd}</div><div class="lines"></div><div class="bar"></div><div class="warn"></div></div>`;
    const lines = $('.lines', root), bar = $('.bar', root), warn = $('.warn', root);
    const made = new Set(); const els = {};
    return s => {
      if (s.fail) {
        lines.innerHTML = `<div class="ln done" style="--i:0"><span class="m">✓</span><span>${t.stages.app}</span></div><div class="ln err" style="--i:1"><span class="m err">✗</span><span class="err">${t.stages.agent} — ${t.failT}</span></div><div class="sub">${t.failP}</div><div class="actions"><span>[r] ${t.retry}</span><span>[d] ${t.diag}</span><span>[c] ${t.copy}</span><span>[q] ${t.quit}</span></div>`;
        bar.textContent = ''; warn.textContent = ''; return;
      }
      STAGES.forEach((st, i) => {
        const state = s.ds.has(st) ? 'done' : i === s.cur ? 'active' : 'pending';
        let ln = els[st];
        if (!ln) { ln = els[st] = el('div', 'ln'); ln.style.setProperty('--i', i); ln.innerHTML = '<span class="m"></span><span class="x"></span><span class="t"></span>'; lines.appendChild(ln); }
        ln.className = 'ln ' + state;
        $('.m', ln).textContent = state === 'done' ? '✓' : state === 'active' ? '…' : '·';
        $('.x', ln).textContent = t.stages[st] + (state === 'active' ? '' : '');
        $('.t', ln).textContent = state === 'done' ? (s.doneAt[st] || 0) + ' ms' : '';
        let sub = ln.nextSibling && ln.nextSibling.classList && ln.nextSibling.classList.contains('sub') ? ln.nextSibling : null;
        if (st === 'data' && !s.ds.has('data') && s.step > 0) {
          if (!sub) { sub = el('div', 'sub'); ln.after(sub); }
          sub.textContent = '└ ' + t.bootDataSteps[s.step - 1] + ' (' + s.step + '/4)';
        } else if (sub) sub.remove();
      });
      const n = s.ds.size, hashes = '#'.repeat(n * 4 + (!s.ds.has('data') && s.step > 0 ? s.step - 1 : 0)).padEnd(20, '·').slice(0, 20);
      bar.innerHTML = `[${hashes}] <b>${n}/5</b>${s.ready ? '' : '<span class="caret"></span>'}`;
      warn.textContent = s.slow ? (t.bootWarn + ' — ' + (STAGES[s.cur] === 'data' && s.step > 0 ? t.slowData : t.slow)) : '';
    };
  },
};

/* ───────── 卡片与引擎 ───────── */
const cards = [];
const PIN = (() => { const m = location.hash.match(/t=(\d+)/); return m ? +m[1] : null; })();   // #t=1500:固定在某一时刻(截图 / 逐帧检查用)
function buildCard(opt) {
  const t = T();
  const card = el('article', 'card');
  card.innerHTML = `
    <div class="win"><div class="shell"><div class="tb"><i></i><i></i><i></i></div><div class="rail"><i></i><i></i><i></i></div><div class="panel"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="work"><i style="width:55%"></i><i></i><i style="width:80%"></i><i style="width:35%"></i><div class="cmp"></div></div></div>
      <div class="ov"><div class="topline" ${opt.k === 'E' ? '' : 'hidden'}><div class="f"></div></div><div class="ct"></div></div>
      <div class="cap"></div><div class="cap-r"><button type="button">${t.replayOne}</button></div></div>
    <h2><span class="k">${opt.k}</span><span>${opt.n[S.lang]}</span>${opt.cur ? `<span class="cur">${t.current}</span>` : ''}</h2>
    <p class="sub">${opt.d[S.lang]}</p>
    <div class="pc"><div class="p"><b>${t.pros}</b><ul>${opt.pros[S.lang].map(x => `<li>${x}</li>`).join('')}</ul></div><div class="c"><b>${t.cons}</b><ul>${opt.cons[S.lang].map(x => `<li>${x}</li>`).join('')}</ul></div></div>
    <div class="meta"><span class="cx">${t.cx}:${t[opt.cx]}</span><span class="spacer"></span><button class="btn" type="button" data-pick="${opt.k}">${t.pick}</button></div>`;
  const c = { opt, card, win: $('.win', card), ov: $('.ov', card), ct: $('.ct', card), cap: $('.cap', card), run: null, update: null, t0: 0 };
  $('.cap-r button', card).addEventListener('click', () => reset(c));
  $('[data-pick]', card).addEventListener('click', () => pick(opt.k));
  return c;
}
function reset(c) {
  c.run = { contentAt: null, revealAt: null, shown: false };
  c.ov.className = 'ov'; c.ct.className = 'ct'; c.ct.innerHTML = '';
  c.t0 = performance.now(); c.update = null; c.mounted = false; c.frozen = false;
  if (c.opt.k === 'E') { const f = $('.topline .f', c.ov); if (f) f.style.width = '0'; }
}
function frame(now) {
  for (const c of cards) {
    if (!c.run) continue;
    if (c.frozen) continue;
    const t = PIN != null ? PIN : (now - c.t0) * S.speed;
    if (PIN != null && !c.pinned) { c.pinned = true; c.run = { contentAt: null, revealAt: null }; for (let x = 0; x < PIN; x += 16) derive(x, c.run); }
    const s = derive(t, c.run);
    if (s.contentVisible && !c.mounted) {   // 内容出现的那一刻:挂载并开始入场动画
      c.mounted = true; c.update = DESIGNS[c.opt.k](c.ct, c.run); c.ct.classList.add('on');
    }
    if (c.update) c.update(s, c.ov);
    c.ov.classList.toggle('hide', s.revealing);
    if (s.done) { c.ov.classList.add('gone'); c.frozen = true; }
    const note = s.contentVisible ? '' : (s.settled ? T().capAdopt : '');
    c.cap.textContent = `${T().t} ${Math.min(t, 99999).toFixed(0)} ms · ${s.fail ? '✗ ' + s.fail : s.done ? '✓' : s.revealing ? 'fade-out' : `${s.count}/5`}${note ? ' · ' + note : ''}`;
  }
  requestAnimationFrame(frame);
}
function replayAll() { cards.forEach(reset); }

/* ───────── 控件 ───────── */
function segment(id, items, get, set) {
  const box = $('#' + id); box.innerHTML = '';
  items.forEach(([v, label]) => {
    const b = el('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', String(get() === v));
    b.addEventListener('click', () => { set(v); [...box.children].forEach((x, i) => x.setAttribute('aria-pressed', String(items[i][0] === get()))); });
    box.appendChild(b);
  });
}
function applyChrome() {
  document.documentElement.dataset.theme = S.theme; document.documentElement.dataset.motion = S.motion; document.documentElement.lang = S.lang === 'zh' ? 'zh-CN' : 'en';
}
function renderControls() {
  const t = T();
  $('#h1').textContent = t.title;
  document.querySelectorAll('[data-t]').forEach(n => n.textContent = t[n.dataset.t]);
  segment('scen', Object.keys(SCEN).map(k => [k, t.scenarios[k]]), () => S.scen, v => { S.scen = v; replayAll(); });
  segment('theme', [['dark', t.dark], ['light', t.light]], () => S.theme, v => { S.theme = v; applyChrome(); });
  segment('motion', [['full', t.full], ['reduced', t.reduced], ['off', t.off]], () => S.motion, v => { S.motion = v; applyChrome(); replayAll(); });
  segment('speed', [[1, '1×'], [0.5, '0.5×'], [0.25, '0.25×']], () => S.speed, v => { S.speed = v; replayAll(); });
  segment('lang', [['zh', '中文'], ['en', 'EN']], () => S.lang, v => { S.lang = v; applyChrome(); build(); });
  $('#replayAll').textContent = t.replay;
  $('#intro').innerHTML = t.introHtml;
  renderPick();
}
function pick(k) { S.picked = k; renderPick(); cards.forEach(c => { c.card.classList.toggle('picked', c.opt.k === k); $('[data-pick]', c.card).textContent = c.opt.k === k ? T().picked : T().pick; }); }
function renderPick() {
  const t = T(), opt = OPTIONS.find(o => o.k === S.picked);
  $('#pickText').textContent = opt ? t.pickDone(opt.k, opt.n[S.lang]) : t.pickNone;
  const b = $('#copyPick'); b.hidden = !opt; if (opt) { b.textContent = t.copyBtn.replace('X', opt.k); b.onclick = () => { navigator.clipboard && navigator.clipboard.writeText('选 ' + opt.k).catch(() => {}); }; }
}
function build() {
  const grid = $('#grid'); grid.innerHTML = ''; cards.length = 0;
  OPTIONS.forEach(o => { const c = buildCard(o); cards.push(c); grid.appendChild(c.card); reset(c); });
  renderControls(); pick(S.picked);
}
$('#replayAll').addEventListener('click', replayAll);
applyChrome(); build(); requestAnimationFrame(frame);
})();
</script>
